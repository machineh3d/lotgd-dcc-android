name: Build LotGD-DCC Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
            echo "DCC_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> "$GITHUB_ENV"
            echo "USE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "USE_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "No release keystore secret set — building debug APK."
          fi

      - name: Build Signed APK
        env:
          DCC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DCC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DCC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ "$USE_RELEASE_SIGNING" = "true" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/lotgd-dcc-android.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk dist/lotgd-dcc-android-debug.apk
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release-keystore.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotgd-dcc-android-apk
          path: dist/*.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
